name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unit, evidence and build
    runs-on: ubuntu-latest
    # Fork 的 pull_request 拿不到 secrets，素材 checkout 必然失败。依赖素材的验收
    # 只在本仓库分支上跑；外部 PR 由下面的 external-pr job 覆盖不依赖素材的检查。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out original assets
        uses: actions/checkout@v4
        with:
          repository: WispSnow/angel2-assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: public/assets/original

      # Vite 会把 public/ 下的一切原样复制进构建产物；不删就会把素材仓库的 git
      # 元数据打进 release/ 和 Windows 安装包。
      - name: Strip nested git metadata
        shell: bash
        run: rm -rf public/assets/original/.git

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project documentation contracts
        run: pnpm docs:check

      - name: Verify reverse-engineering evidence baseline
        run: node reverse/tools/angel2-phase1-verify.mjs

      - name: Run unit tests
        if: github.event_name == 'pull_request'
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  coverage:
    name: Coverage threshold
    # 只在推送到 main 时跑，因此天然不受 fork PR 的 secret 限制。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out original assets
        uses: actions/checkout@v4
        with:
          repository: WispSnow/angel2-assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: public/assets/original

      # Vite 会把 public/ 下的一切原样复制进构建产物；不删就会把素材仓库的 git
      # 元数据打进 release/ 和 Windows 安装包。
      - name: Strip nested git metadata
        shell: bash
        run: rm -rf public/assets/original/.git

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce coverage thresholds
        run: pnpm test:coverage

  e2e:
    name: Chromium (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Fork 的 pull_request 拿不到 secrets，素材 checkout 必然失败。依赖素材的验收
    # 只在本仓库分支上跑；外部 PR 由下面的 external-pr job 覆盖不依赖素材的检查。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out original assets
        uses: actions/checkout@v4
        with:
          repository: WispSnow/angel2-assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: public/assets/original

      # Vite 会把 public/ 下的一切原样复制进构建产物；不删就会把素材仓库的 git
      # 元数据打进 release/ 和 Windows 安装包。
      - name: Strip nested git metadata
        shell: bash
        run: rm -rf public/assets/original/.git

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pinned Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install pinned Chromium and runtime dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Install Playwright runtime dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright shard
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

  external-pr:
    name: Type check and build (fork PR)
    # Fork PR 拿不到素材 secret，因此只跑完全不依赖 public/assets/original/ 的检查。
    # 注意：pnpm docs:check 与大部分单元测试依赖 reverse/ 下被 gitignore 的取证产物，
    # 在干净检出上无法运行，因此不列在这里。
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build production bundle
        run: pnpm build
