name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium and Playwright runtime dependencies
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Verify reverse-engineering evidence baseline
        run: node reverse/tools/angel2-phase1-verify.mjs

      - name: Run project checks
        run: pnpm check
