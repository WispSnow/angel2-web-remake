name: Windows desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Tauri NSIS (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # windows-latest 镜像的 git 全局配置是 core.autocrlf=true。本仓库自带
      # `.gitattributes`（`* text=auto eol=lf`）不受影响，但素材仓库
      # WispSnow/angel2-assets 没有 .gitattributes，检出时 107 个 JSON 和 1 个 SVG
      # 会被逐个换成 CRLF，字节数比清单多出各自的换行数，check:assets 随即判定
      # 「素材包不完整」。二进制素材没有这个问题，所以症状是「只有文本素材全错」。
      - name: Force verbatim checkouts on the Windows runner
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out original assets
        uses: actions/checkout@v4
        with:
          repository: WispSnow/angel2-assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: public/assets/original

      # Vite 会把 public/ 下的一切原样复制进构建产物；不删就会把素材仓库的 git
      # 元数据打进 release/ 和 Windows 安装包。
      - name: Strip nested git metadata
        shell: bash
        run: rm -rf public/assets/original/.git

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build audited Windows installer
        run: pnpm desktop:build:windows

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $sizeMiB = [math]::Round($installers[0].Length / 1MB, 1)
          Write-Output "Installer: $($installers[0].Name) ($sizeMiB MiB)"

      - name: Upload unsigned Windows verification package
        uses: actions/upload-artifact@v4
        with:
          name: angel2-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
