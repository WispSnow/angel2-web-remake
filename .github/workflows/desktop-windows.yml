name: Windows desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Tauri NSIS (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build audited Windows installer
        run: pnpm desktop:build:windows

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $sizeMiB = [math]::Round($installers[0].Length / 1MB, 1)
          Write-Output "Installer: $($installers[0].Name) ($sizeMiB MiB)"

      - name: Upload private Windows package
        uses: actions/upload-artifact@v4
        with:
          name: angel2-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
