name: Windows desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Tauri NSIS (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # windows-latest 镜像的 git 全局配置是 core.autocrlf=true。本仓库自带
      # `.gitattributes`（`* text=auto eol=lf`）不受影响，但素材仓库
      # WispSnow/angel2-assets 没有 .gitattributes，检出时 107 个 JSON 和 1 个 SVG
      # 会被逐个换成 CRLF，字节数比清单多出各自的换行数，check:assets 随即判定
      # 「素材包不完整」。二进制素材没有这个问题，所以症状是「只有文本素材全错」。
      - name: Force verbatim checkouts on the Windows runner
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out original assets
        uses: actions/checkout@v4
        with:
          repository: WispSnow/angel2-assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          path: public/assets/original

      # Vite 会把 public/ 下的一切原样复制进构建产物；不删就会把素材仓库的 git
      # 元数据打进 release/ 和 Windows 安装包。
      - name: Strip nested git metadata
        shell: bash
        run: rm -rf public/assets/original/.git

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build audited Windows installer
        run: pnpm desktop:build:windows

      - name: Verify installer artifact and record its checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $sizeMiB = [math]::Round($installer.Length / 1MB, 1)
          Write-Output "Installer: $($installer.Name) ($sizeMiB MiB)"

          # 安装包未经代码签名，玩家侧唯一能自证「下载的就是这里构建的东西」的手段就是
          # 校验和。sidecar 随 artifact 一起上传，转发到网盘时要跟安装包放在一起。
          # 格式与 sha256sum -c 一致（哈希 + 两个空格 + 文件名），换行强制 LF，
          # 否则 CRLF 会让非 Windows 侧的 sha256sum -c 读出带 \r 的文件名而报找不到。
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLower()
          $line = $hash + '  ' + $installer.Name
          [System.IO.File]::WriteAllText($installer.FullName + '.sha256', $line + "`n")

          # 同时写进运行摘要：转发到网盘的人不必先下载 artifact 才能拿到要公布的哈希。
          @(
            '### Windows 安装包（未签名）',
            '',
            '| 项 | 值 |',
            '| --- | --- |',
            ('| 文件 | ' + $installer.Name + ' |'),
            ('| 大小 | ' + $sizeMiB + ' MiB |'),
            ('| SHA-256 | ' + $hash + ' |'),
            '',
            '分发时请把 .sha256 与安装包一起提供，并附上 README「Windows 安装包」一节的校验方法。'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload unsigned Windows verification package
        uses: actions/upload-artifact@v4
        with:
          name: angel2-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
