<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
  <title id="title">第 1 关部署界面低保真图</title>
  <desc id="desc">640×350 纯黑左栏使用原版职业棋子、三列五行复合名单和原版热区；右侧保留 Remake 信息框与落点按钮。</desc>
  <defs>
    <pattern id="menu" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#612b20"/>
      <rect width="2" height="2" fill="#8b4127"/>
      <rect x="2" y="2" width="2" height="2" fill="#8b4127"/>
    </pattern>
    <style>
      .label { font: 8px sans-serif; fill: #fff6c8; }
      .small { font: 6px sans-serif; fill: #f1deb0; }
      .dim { font: 6px sans-serif; fill: #746b5e; }
      .panel { fill: url(#menu); stroke: #e0b864; stroke-width: 1; }
      .slot { fill: #050405; stroke: #75694f; stroke-width: 1; }
      .fixed { fill: #201608; stroke: #f3d96b; stroke-width: 1.5; }
      .figure { fill: #194f75; stroke: #f1d66b; stroke-width: .8; }
    </style>
  </defs>
  <rect width="640" height="350" fill="#050405"/>
  <rect x="480" y="0" width="160" height="329" fill="#211719" stroke="#8f6035"/>

  <g aria-label="原版三列五行复合名单">
    <g aria-label="第一列">
      <rect x="11" y="37" width="34" height="43" rx="8" class="figure"/><text x="80" y="47" class="label">妮雅</text><rect x="57" y="59" width="80" height="24" class="fixed"/><text x="64" y="73" class="small">士兵 · Lv 3</text>
      <rect x="11" y="97" width="34" height="43" rx="8" class="figure"/><text x="80" y="107" class="label">希蜜</text><rect x="57" y="119" width="80" height="24" class="slot"/><text x="64" y="133" class="small">士兵 · Lv 3</text>
      <rect x="11" y="157" width="34" height="43" rx="8" class="figure"/><text x="80" y="167" class="label">蒙欣曼</text><rect x="57" y="179" width="80" height="24" class="slot"/><text x="64" y="193" class="small">士兵 · Lv 3</text>
      <rect x="11" y="217" width="34" height="43" rx="8" class="figure"/><text x="80" y="227" class="label">拉朵那</text><rect x="57" y="239" width="80" height="24" class="slot"/><text x="64" y="253" class="small">士兵 · Lv 3</text>
      <rect x="11" y="277" width="38" height="43" rx="8" fill="#235735" stroke="#f1d66b"/><text x="80" y="287" class="label">葛蒂拉斯</text><rect x="57" y="299" width="80" height="24" class="slot"/><text x="64" y="313" class="small">魔術士 · Lv 1</text>
    </g>
    <g aria-label="第二列">
      <rect x="155" y="37" width="34" height="43" rx="8" class="figure"/><text x="224" y="47" class="label">士兵</text><rect x="201" y="59" width="80" height="24" class="fixed"/><text x="208" y="73" class="small">士兵 · Lv 1</text>
      <rect x="155" y="97" width="34" height="43" rx="8" class="figure"/><text x="224" y="107" class="label">士兵</text><rect x="201" y="119" width="80" height="24" class="fixed"/><text x="208" y="133" class="small">士兵 · Lv 1</text>
      <rect x="155" y="157" width="34" height="43" rx="8" class="figure"/><text x="224" y="167" class="label">士兵</text><rect x="201" y="179" width="80" height="24" class="fixed"/><text x="208" y="193" class="small">士兵 · Lv 1</text>
      <rect x="155" y="217" width="34" height="43" rx="8" class="figure"/><text x="224" y="227" class="label">士兵</text><rect x="201" y="239" width="80" height="24" class="fixed"/><text x="208" y="253" class="small">士兵 · Lv 1</text>
      <rect x="201" y="299" width="80" height="24" class="slot"/><text x="208" y="313" class="dim">空名單</text>
    </g>
    <g aria-label="第三列空名单">
      <rect x="345" y="59" width="80" height="24" class="slot"/><text x="352" y="73" class="dim">空名單</text>
      <rect x="345" y="119" width="80" height="24" class="slot"/><text x="352" y="133" class="dim">空名單</text>
      <rect x="345" y="179" width="80" height="24" class="slot"/><text x="352" y="193" class="dim">空名單</text>
      <rect x="345" y="239" width="80" height="24" class="slot"/><text x="352" y="253" class="dim">空名單</text>
      <rect x="345" y="299" width="80" height="24" class="slot"/><text x="352" y="313" class="dim">空名單</text>
    </g>
  </g>

  <g aria-label="原版页签与完成">
    <rect x="440" y="35" width="80" height="24" class="panel"/><text x="477" y="50" class="label">Ⅰ</text>
    <rect x="440" y="65" width="80" height="24" class="panel"/><text x="477" y="80" class="label">Ⅱ</text>
    <rect x="440" y="95" width="80" height="24" class="panel"/><text x="477" y="110" class="label">Ⅲ</text>
    <rect x="540" y="35" width="80" height="24" class="panel"/><text x="565" y="50" class="label">結束</text>
  </g>

  <g aria-label="Remake 右侧信息框">
    <rect x="488" y="127" width="144" height="191" fill="#10080bd8" stroke="#704137"/>
    <text x="496" y="142" class="label">騎士城堡前 · 部署</text>
    <text x="496" y="157" class="label">已出場 5／8</text>
    <text x="496" y="168" class="small">剩餘空位 3</text>
    <text x="496" y="179" class="small">下一落點 21,33</text>
    <rect x="496" y="184" width="40" height="14" class="slot"/><rect x="538" y="184" width="40" height="14" class="slot"/><rect x="580" y="184" width="40" height="14" class="slot"/>
    <text x="499" y="193" class="dim">21,33</text><text x="541" y="193" class="small">23,33</text><text x="583" y="193" class="small">25,33</text>
    <rect x="496" y="207" width="40" height="40" fill="#305080" stroke="#e0b864"/>
    <text x="542" y="218" class="small">人物　妮雅</text><text x="542" y="229" class="small">職業　士兵</text><text x="542" y="240" class="small">狀態　固定 · 已出場</text>
    <text x="496" y="271" class="dim">方向鍵／WZAS 移動</text><text x="496" y="282" class="dim">主／次操作 · Tab 落點焦點</text>
  </g>

  <rect x="2" y="329" width="636" height="19" fill="#170b0d" stroke="#e0b864"/>
  <text x="10" y="342" class="label">選擇出場人物；五至八人均可完成。</text>
</svg>
