[sdl]
fullscreen = false
autolock = false
waitonerror = false
showmenu = false

[log]
logfile = reverse/logs/dosbox-x-debug.log
files = false
exec = false
dosmisc = false
int21 = false
fileio = false
debuggerrun = debugger

[dosbox]
machine = svga_s3
captures = reverse/captures
memsize = 16

[cpu]
core = normal
cycles = fixed 12000

[mixer]
nosound = true

[midi]
mpu401 = none

[sblaster]
sbtype = none

[speaker]
pcspeaker = false

[dos]
xms = true
ems = true
umb = true

[autoexec]
mount c "reverse/work/ANGEL2"
c:
DEBUGBOX GO.EXE
exit
